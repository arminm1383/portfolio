<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon-pokeball.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Armin Mohammadi</title>
    <meta name="description" content="Armin Mohammadi is a builder designing with taste, engineering with intuition, and putting it all together with a commitment to visual craft." />
    <link rel="canonical" href="https://armin-mohammadi.com/" />
    <!-- Link previews. Crawlers don't run JS, so every route shares these; per-route titles are set in App.tsx. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Armin Mohammadi" />
    <meta property="og:title" content="Armin Mohammadi" />
    <meta property="og:description" content="A builder designing with taste, engineering with intuition, and putting it all together with a commitment to visual craft." />
    <meta property="og:url" content="https://armin-mohammadi.com/" />
    <meta property="og:image" content="https://armin-mohammadi.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="armin mohammadi's portfolio: hi, i'm armin" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Armin Mohammadi" />
    <meta name="twitter:description" content="A builder designing with taste, engineering with intuition, and putting it all together with a commitment to visual craft." />
    <meta name="twitter:image" content="https://armin-mohammadi.com/og-image.png" />
    <meta name="twitter:image:alt" content="armin mohammadi's portfolio: hi, i'm armin" />
    <!-- Fonts load up front (not via a CSS @import) so pages can hold until they're ready — no fallback-font pop-in -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Only faces rendered pages use: Open Sans (400/600/700 + 600 italic) and JetBrains Mono 500 (Rocket carousel chips) -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500&family=Open+Sans:ital,wght@0,400;0,600;0,700;1,600&display=swap" />
    <!-- GitHub Pages SPA redirect handler -->
    <script>
      (function(l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function(s) {
            return s.replace(/~and~/g, '&')
          })
          window.history.replaceState(null, null,
            decoded[0] + (decoded[1] ? '?' + decoded[1] : '') + l.hash
          )
        }
      }(window.location))
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
