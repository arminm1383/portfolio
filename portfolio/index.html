<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon-pokeball.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Armin Mohammadi — Product Designer</title>
    <!-- Fonts load up front (not via a CSS @import) so pages can hold until they're ready — no fallback-font pop-in -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Mono&family=JetBrains+Mono:wght@500&family=Open+Sans:ital,wght@0,400;0,600;0,700;1,600&family=Tiro+Tamil&display=swap" />
    <!-- Case-study icons: only the glyphs in use (Figma uses Material Symbols Rounded) -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=all_inclusive,explore,forum,palette,phone_iphone,school,support_agent&display=block" />
    <!-- GitHub Pages SPA redirect handler -->
    <script>
      (function(l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function(s) {
            return s.replace(/~and~/g, '&')
          })
          window.history.replaceState(null, null,
            decoded[0] + (decoded[1] ? '?' + decoded[1] : '') + l.hash
          )
        }
      }(window.location))
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
